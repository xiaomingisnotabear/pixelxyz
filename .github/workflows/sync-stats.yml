name: Sync platform stats

on:
  # 每天 03:17 UTC（北京时间 11:17）自动同步
  schedule:
    - cron: "17 3 * * *"
  # 支持手动触发
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-stats
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch platform stats
        run: node scripts/sync-stats.mjs

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats.json
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 自动同步各平台数据 [skip ci]"
            git push
            echo "已提交并推送"
          fi
