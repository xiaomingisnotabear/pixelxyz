<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>PixelXYZ像素空间</title>
  <meta name="description" content="PixelXYZ像素空间 · 数码频道" />
  <meta name="theme-color" content="#050507" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />

  <!-- 渲染前应用主题，避免闪烁 -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme") || (window.SITE && window.SITE.meta && window.SITE.meta.theme) || "dark";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <!-- 背景层：极光 + 网格 + 噪点 -->
  <div class="bg" aria-hidden="true">
    <div class="bg__aurora bg__aurora--1"></div>
    <div class="bg__aurora bg__aurora--2"></div>
    <div class="bg__aurora bg__aurora--3"></div>
    <div class="bg__grid"></div>
    <div class="bg__grain"></div>
  </div>

  <!-- 鼠标聚光 -->
  <div class="spotlight" id="spotlight" aria-hidden="true"></div>

  <!-- 滚动进度 -->
  <div class="scroll-progress" id="scrollProgress" aria-hidden="true"></div>

  <!-- ================= 导航 ================= -->
  <header class="nav" id="nav">
    <div class="container nav__inner">
      <a class="brand" href="#home">
        <span class="brand__mark" data-bind="brand.mark">P</span>
        <span class="brand__name" data-bind="brand.name">PixelXYZ</span>
      </a>

      <nav class="nav__links" id="navLinks" aria-label="主导航"><!-- JS --></nav>

      <div class="nav__actions">
        <button class="icon-btn" id="themeToggle" type="button" aria-label="切换主题" title="切换主题">
          <svg class="i-sun" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="icon-btn nav__burger" id="navBurger" type="button" aria-label="菜单" aria-expanded="false">
          <span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <!-- ================= Hero ================= -->
    <section class="hero" id="home">
      <div class="container hero__inner">
        <div class="hero__visual" data-parallax="0.08">
          <div class="glow-avatar">
            <div class="glow-avatar__ring"></div>
            <img id="heroAvatar" src="assets/avatar.jpg" alt="PixelXYZ像素空间" width="220" height="220" />
          </div>
        </div>

        <div class="hero__text">
          <p class="badge" data-reveal>
            <span class="badge__dot"></span>
            <span data-bind="hero.badge">数码频道</span>
          </p>

          <h1 class="hero__name" data-reveal data-reveal-delay="1" data-bind="hero.name">PixelXYZ 像素空间</h1>

          <p class="hero__slogan" data-reveal data-reveal-delay="2">
            <span class="grad" data-bind="hero.slogan">像素无限，一往无前</span>
          </p>
          <p class="hero__slogan-en" data-reveal data-reveal-delay="2" data-bind="hero.sloganEn">Pixel Infinity</p>

          <p class="hero__tagline" data-reveal data-reveal-delay="3" data-bind="hero.tagline">...</p>

          <div class="hero__cta" id="heroCta" data-reveal data-reveal-delay="4"><!-- JS --></div>

          <div class="hero__socials" id="heroSocials" data-reveal data-reveal-delay="5"><!-- JS --></div>
        </div>
      </div>

      <div class="hero__scroll" aria-hidden="true">
        <span class="hero__scroll-mouse"></span>
        <span class="hero__scroll-text">SCROLL</span>
      </div>
    </section>

    <!-- ================= 跑马灯 ================= -->
    <div class="marquee" id="marquee" aria-hidden="true">
      <div class="marquee__track"><!-- JS --></div>
    </div>

    <!-- ================= 数据 ================= -->
    <section class="section" id="stats">
      <div class="container">
        <header class="sec-head">
          <p class="sec-head__sub" data-reveal data-bind="stats.subtitle">DATA</p>
          <h2 class="sec-head__title" data-reveal data-reveal-delay="1" data-bind="stats.title">频道数据</h2>
        </header>
        <div class="stats" id="statsGrid"><!-- JS --></div>
        <p class="stats__note" data-reveal data-bind="stats.note"></p>
      </div>
    </section>

    <!-- ================= 关于 ================= -->
    <section class="section" id="about">
      <div class="container">
        <header class="sec-head">
          <p class="sec-head__sub" data-reveal data-bind="about.subtitle">ABOUT</p>
          <h2 class="sec-head__title" data-reveal data-reveal-delay="1" data-bind="about.title">关于频道</h2>
        </header>

        <div class="about">
          <div class="about__text" id="aboutText" data-reveal><!-- JS --></div>
          <ul class="about__facts" id="aboutFacts" data-reveal data-reveal-delay="2"><!-- JS --></ul>
        </div>
      </div>
    </section>

    <!-- ================= 作品 ================= -->
    <section class="section" id="videos">
      <div class="container">
        <header class="sec-head sec-head--split">
          <div>
            <p class="sec-head__sub" data-reveal data-bind="videos.subtitle">WORKS</p>
            <h2 class="sec-head__title" data-reveal data-reveal-delay="1" data-bind="videos.title">最新作品</h2>
          </div>
          <a class="link-more" id="videosMore" href="#" data-reveal data-reveal-delay="2">
            查看全部投稿 <span class="link-more__arrow">→</span>
          </a>
        </header>
        <div class="videos" id="videosGrid"><!-- JS --></div>
      </div>
    </section>

    <!-- ================= 关注 ================= -->
    <section class="section" id="contact">
      <div class="container">
        <div class="cta-card" data-reveal>
          <p class="sec-head__sub" data-bind="contact.subtitle">FOLLOW</p>
          <h2 class="cta-card__title" data-bind="contact.title">保持关注</h2>
          <p class="cta-card__text" data-bind="contact.text">...</p>
          <div class="cta-card__actions" id="contactActions"><!-- JS --></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <div class="footer__left">
        <span class="brand__mark brand__mark--sm" data-bind="brand.mark">P</span>
        <span data-bind="footer.text">©</span>
      </div>
      <p class="footer__slogan" data-bind="footer.slogan">pixel infinity</p>
    </div>
  </footer>

  <button class="to-top" id="toTop" type="button" aria-label="回到顶部">
    <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>

  <script src="js/content.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
