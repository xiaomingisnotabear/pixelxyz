<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>PixelXYZ像素空间</title>
  <meta name="description" content="PixelXYZ像素空间 · 数码频道" />
  <meta name="theme-color" content="#0b0b0b" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

  <!-- 移动端：添加到主屏 / 独立窗口运行 -->
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="PixelXYZ" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <!-- 防止 iOS 把「抖音号 49256467732」这类数字自动变成可拨号的蓝色电话链接 -->
  <meta name="format-detection" content="telephone=no,date=no,address=no,email=no" />
  <link rel="preload" as="image" href="assets/avatar.webp" fetchpriority="high" />

  <link rel="stylesheet" href="css/style.css" />

  <!-- 渲染前应用主题，避免闪烁 -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme") || "dark";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <!-- ============ 背景：弥散光雾 + 网点图 + 浮尘粒子 + 细噪点 ============ -->
  <div class="bg" aria-hidden="true">
    <div class="bg__haze">
      <i></i><i></i><i></i><i></i>
    </div>
    <div class="bg__dots"></div>
    <div class="bg__grain"></div>
  </div>

  <!-- 浮尘粒子（画在最前，像镜头前的尘埃） -->
  <canvas class="fx-canvas" id="fx" aria-hidden="true"></canvas>

  <!-- 鼠标聚光 -->
  <div class="spotlight" id="spotlight" aria-hidden="true"></div>

  <!-- 自定义终端光标 -->
  <div class="cursor" id="cursor" aria-hidden="true">
    <span class="cursor__ring"></span>
    <span class="cursor__dot"></span>
  </div>

  <!-- 滚动进度 -->
  <div class="scroll-progress" id="scrollProgress" aria-hidden="true"></div>

  <!-- ================= 导航 ================= -->
  <header class="nav" id="nav">
    <div class="container nav__inner">
      <a class="brand" href="#home">
        <img class="brand__avatar" id="brandLogo" src="assets/avatar.webp" alt="PixelXYZ像素空间" width="28" height="28" />
        <span class="brand__text">
          <span class="brand__name" data-bind="brand.name">PixelXYZ</span>
          <span class="brand__name-cn" data-bind="brand.nameCn">像素空间</span>
        </span>
      </a>

      <nav class="nav__links" id="navLinks" aria-label="主导航"><!-- JS --></nav>

      <div class="nav__actions">
        <button class="icon-btn" id="themeToggle" type="button" aria-label="切换主题" title="切换主题">
          <svg class="i-sun" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="icon-btn nav__burger" id="navBurger" type="button" aria-label="菜单" aria-expanded="false">
          <span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <!-- ================= Hero ================= -->
    <section class="hero" id="home">
      <div class="container hero__inner">
        <div class="hero__text">
          <p class="badge anim-in" style="--d:0ms">
            <span class="badge__dot"></span>
            <span data-bind="hero.badge">数码频道</span>
          </p>

          <h1 class="hero__name anim-in" style="--d:120ms" data-bind="hero.name">PixelXYZ 像素空间</h1>

          <p class="hero__slogan anim-in" style="--d:240ms">
            <span class="grad" data-bind="hero.slogan">像素无限，一往无前</span>
          </p>
          <p class="hero__slogan-en anim-in" style="--d:320ms" data-bind="hero.sloganEn">Pixel Infinity</p>

          <p class="hero__tagline anim-in" style="--d:420ms">
            <span id="typeTagline" data-bind="hero.tagline"></span><span class="type-caret" id="typeCaret"></span>
          </p>

          <div class="hero__cta anim-in" id="heroCta" style="--d:540ms"><!-- JS --></div>
          <div class="hero__socials anim-in" id="heroSocials" style="--d:660ms"><!-- JS --></div>
        </div>

        <div class="hero__visual anim-in" style="--d:200ms" data-parallax="0.06">
          <div class="glow-avatar">
            <div class="glow-avatar__ring"></div>
            <img id="heroAvatar" src="assets/avatar.webp" alt="PixelXYZ像素空间" width="220" height="220" fetchpriority="high" decoding="async" />
          </div>
        </div>
      </div>

      <div class="hero__scroll" aria-hidden="true">
        <span class="hero__scroll-mouse"></span>
        <span class="hero__scroll-text">SCROLL</span>
      </div>
    </section>

    <!-- ================= 跑马灯 ================= -->
    <div class="marquee" aria-hidden="true"><div class="marquee__track"><!-- JS --></div></div>

    <!-- ================= 数据 + 内容方向 ================= -->
    <section class="section" id="stats">
      <div class="container">
        <header class="sec-head">
          <p class="sec-head__sub" data-reveal data-bind="stats.subtitle">DATA</p>
          <h2 class="sec-head__title" data-reveal data-reveal-delay="1" data-bind="stats.title">频道数据</h2>
        </header>

        <div class="stats" id="statsGrid"><!-- JS --></div>

        <div class="breakdown" id="breakdown">
          <h3 class="breakdown__title" data-reveal data-bind="stats.breakdown.title">各平台明细</h3>
          <div class="breakdown__rows" id="breakdownRows"><!-- JS --></div>
        </div>

        <div class="divider" data-reveal><span class="divider__glow"></span></div>

        <div class="focus">
          <div class="focus__head" data-reveal>
            <h3 class="focus__title" data-bind="focus.title">内容方向</h3>
            <span class="focus__sub" data-bind="focus.subtitle">CONTENT FOCUS</span>
          </div>
          <div class="bars" id="focusBars"><!-- JS --></div>
        </div>

        <p class="stats__note" data-reveal data-bind="stats.note"></p>
      </div>
    </section>

    <!-- ================= 终端简介 + 档案 ================= -->
    <section class="section" id="about">
      <div class="container">
        <header class="sec-head">
          <p class="sec-head__sub" data-reveal data-bind="terminal.subtitle">WHO AM I</p>
          <h2 class="sec-head__title" data-reveal data-reveal-delay="1" data-bind="terminal.title">频道简介</h2>
        </header>

        <div class="about">
          <!-- 终端窗口 -->
          <div class="terminal" id="terminal" data-reveal>
            <div class="terminal__bar">
              <span class="terminal__dot terminal__dot--r"></span>
              <span class="terminal__dot terminal__dot--y"></span>
              <span class="terminal__dot terminal__dot--g"></span>
              <span class="terminal__title" data-bind="terminal.windowTitle">~/space</span>
            </div>
            <div class="terminal__body" id="terminalBody"></div>
          </div>

          <!-- 档案卡 -->
          <div class="profile" data-reveal data-reveal-delay="1">
            <p class="sec-head__sub" data-bind="about.subtitle">PROFILE</p>
            <h3 class="profile__title" data-bind="about.title">频道档案</h3>
            <ul class="about__facts" id="aboutFacts"><!-- JS --></ul>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= 作品 ================= -->
    <section class="section" id="works">
      <div class="container">
        <header class="sec-head sec-head--split">
          <div>
            <p class="sec-head__sub" data-reveal data-bind="works.subtitle">WORKS</p>
            <h2 class="sec-head__title" data-reveal data-reveal-delay="1" data-bind="works.title">作品</h2>
          </div>
          <a class="link-more" id="worksMore" href="#" data-reveal data-reveal-delay="2">
            查看全部投稿 <span class="link-more__arrow">&rarr;</span>
          </a>
        </header>
        <div class="filters" id="worksFilters" role="tablist" data-reveal><!-- JS --></div>
        <div class="videos" id="worksGrid"><!-- JS --></div>
        <p class="works__note" id="worksNote" hidden></p>
      </div>
    </section>

    <!-- ================= 多平台矩阵 ================= -->
    <section class="section" id="platforms">
      <div class="container">
        <header class="sec-head sec-head--split">
          <div>
            <p class="sec-head__sub" data-reveal data-bind="platforms.subtitle">PLATFORMS</p>
            <h2 class="sec-head__title" data-reveal data-reveal-delay="1" data-bind="platforms.title">多平台矩阵</h2>
          </div>
        </header>
        <div class="platforms" id="platformsGrid"><!-- JS --></div>
        <p class="stats__note" data-reveal data-bind="platforms.note"></p>
      </div>
    </section>

    <!-- ================= 关注 ================= -->
    <section class="section" id="contact">
      <div class="container">
        <div class="cta-card" data-reveal>
          <p class="sec-head__sub" data-bind="contact.subtitle">FOLLOW</p>
          <h2 class="cta-card__title" data-bind="contact.title">保持关注</h2>
          <p class="cta-card__text" data-bind="contact.text">...</p>
          <div class="cta-card__actions" id="contactActions"><!-- JS --></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <div class="footer__left">
        <img class="brand__avatar brand__avatar--sm" id="footerLogo" src="assets/avatar.webp" alt="" width="22" height="22" />
        <span data-bind="footer.text">©</span>
      </div>
      <p class="footer__slogan" data-bind="footer.slogan">pixel infinity</p>
    </div>
    <div class="container footer__mail">
      <span class="footer__mail-label" data-bind="footer.emailLabel">邮箱</span>
      <span class="footer__mail-value" data-bind="contact.email">19207560097@163.com</span>
    </div>
  </footer>

  <button class="to-top" id="toTop" type="button" aria-label="回到顶部">
    <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>

  <script src="js/content.js" defer></script>
  <script src="js/particles.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
